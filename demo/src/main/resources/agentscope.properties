# ════════════════════════════════════════════════════════════
# AgentScope 2.0 配置 (复刻自项目技术文档 §13.2)
# ════════════════════════════════════════════════════════════

# Default model for HarnessAgent
agentscope.model.default=openai:deepseek-v4-pro

# Logging
agentscope.logging.level=INFO
agentscope.logging.enable-trace=true

# Workspace
agentscope.workspace.type=local
agentscope.workspace.path=./workspace

# Memory
agentscope.memory.short-term.type=redis
agentscope.memory.short-term.ttl=3600
agentscope.memory.long-term.type=postgresql
